# Fase 38: dependency updates, once a month and grouped, so they cost a couple of CI runs a month (private repo
# minutes). The engine (Cargo) is left out on purpose: deckgym is pinned to a commit (D-013) and moves by hand.
# D-023: paused (open-pull-requests-limit 0) while the CI runs on the owner's PC; back to 2 and 1 after the move to
# the public repository.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
