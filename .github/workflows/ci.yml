name: CI
on:
  push:
    branches: [main]
  pull_request:

# Fase 38 (minutes of the private repo, 2.000 a month with Windows counting double): a newer push to the same branch
# or PR cancels the run in course; the Windows engine job runs only when the engine, the worker or the CI changed;
# the Docker image is built only on main, when something it depends on changed. A skipped job leaves the run green,
# so scripts/deploy.mjs still finds the commit's CI «success».
#
# D-023 (the minutes ran out on 9/10/2026): until the move to the public repository the jobs run on the owner's PC
# (self-hosted runners labelled `tcg-pc`), chosen by the repository variables CI_RUNNER and CI_RUNNER_WINDOWS; without
# them, on GitHub's runners as before. The same steps work on both: Postgres from docker compose (or the one already
# running on the PC), bash everywhere, a database and a port per runner, and on the PC the Rust and WinLibs already
# installed. Dependabot's PRs never run on the PC (they would run new dependencies' install scripts there).
# CI_RUNNER_LIGHT (label tcg-light) takes the jobs without Postgres or Docker (changes, test; engine through
# CI_RUNNER_WINDOWS), so a second PC can help even when its Postgres or Docker is not ready (D-023).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# D-022 (public repository): the jobs only read the repository (checkout); artifacts do not need more.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # What changed against the base (the PR's base, or main before the push): decides the expensive jobs.
  changes:
    if: ${{ !(vars.CI_RUNNER && github.actor == 'dependabot[bot]') }}
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - name: Shell (on the PC it must be Git's bash, not WSL's)
        run: |
          command -v bash
          bash --version | head -1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(engine/|apps/worker/|\.github/workflows/)'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$FILES" | grep -qE '^(Dockerfile|\.dockerignore|docker/|fly\.toml|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|(apps|packages)/[^/]+/package\.json|apps/api/prisma/|engine/Cargo\.toml|\.github/workflows/)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    if: ${{ !(vars.CI_RUNNER && github.actor == 'dependabot[bot]') }}
    runs-on: ${{ vars.CI_RUNNER_LIGHT || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          # D-023: a folder of the job (two runners on the PC shared ~/setup-pnpm: EBUSY).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # D-023: on the PC the pnpm store is already local; saving it to GitHub's cache hung the runners.
          cache: ${{ !vars.CI_RUNNER && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @tcg/domain build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Supertest suite against a real Postgres 17 (migrations applied by test/global-setup.ts), on a database of its own
  # per runner (two runners on the PC never share one, and the sessions' tcg_test stays theirs).
  e2e:
    if: ${{ !(vars.CI_RUNNER && github.actor == 'dependabot[bot]') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      SESSION_SECRET: ci-session-secret-ci-session-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          # D-023: a folder of the job (two runners on the PC shared ~/setup-pnpm: EBUSY).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # D-023: on the PC the pnpm store is already local; saving it to GitHub's cache hung the runners.
          cache: ${{ !vars.CI_RUNNER && 'pnpm' || '' }}
      - name: Postgres (the one already running, or docker compose)
        run: scripts/ci-postgres.sh
      - name: Database of this runner
        run: echo "TEST_DATABASE_URL=postgresql://tcg:tcg@127.0.0.1:5433/tcg_ci_test_$(scripts/ci-runner-id.sh)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @tcg/domain build
      - run: pnpm -F @tcg/api test:e2e

  # Tests de pantallas (Fase 34): the API serving the built PWA on a throwaway database, a worker with the engine
  # stand-in of its tests, and Chromium (phone size) through logging a match (also without signal), a game against
  # the bot with the coach and a situation to solve. Database and port of their own per runner.
  screens:
    if: ${{ !(vars.CI_RUNNER && github.actor == 'dependabot[bot]') }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          # D-023: a folder of the job (two runners on the PC shared ~/setup-pnpm: EBUSY).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # D-023: on the PC the pnpm store is already local; saving it to GitHub's cache hung the runners.
          cache: ${{ !vars.CI_RUNNER && 'pnpm' || '' }}
      - name: Postgres (the one already running, or docker compose)
        run: scripts/ci-postgres.sh
      - name: Database and port of this runner
        run: |
          ID="$(scripts/ci-runner-id.sh)"
          echo "SCREENS_DATABASE_URL=postgresql://tcg:tcg@127.0.0.1:5433/tcg_ci_screens_${ID}" >> "$GITHUB_ENV"
          echo "SCREENS_PORT=$((3300 + $(printf '%s' "$ID" | cksum | cut -d' ' -f1) % 90))" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @tcg/domain build
      - run: pnpm -F @tcg/api build
      - run: pnpm -F @tcg/web build
      - run: pnpm -F @tcg/worker build
      - run: pnpm -F @tcg/web exec playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - run: pnpm -F @tcg/web test:screens
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: screens-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  # engine-cli (AGPL, deckgym-core pinned in engine/Cargo.toml): unit tests and a Windows build kept as an artifact,
  # for a PC without Rust (the worker takes any engine-cli.exe via TCG_ENGINE_PATH or config.json). Also the portable
  # worker (tcg-worker.exe + engine-cli.exe + LEEME.txt) for another PC without Node, Rust or the repository.
  # On the PC: its own Rust (GNU) and WinLibs, and a cargo target of the runner's, never the repository folder's.
  engine:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ${{ vars.CI_RUNNER_WINDOWS || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !vars.CI_RUNNER_WINDOWS }}
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ !vars.CI_RUNNER_WINDOWS }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Rust of the PC (cargo and WinLibs)
        if: ${{ vars.CI_RUNNER_WINDOWS }}
        run: |
          W="$(ls -d "$LOCALAPPDATA"/Microsoft/WinGet/Packages/BrechtSanders.WinLibs*/mingw64/bin | head -1)"
          test -n "$W" || { echo "WinLibs no está instalado en esta PC"; exit 1; }
          echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          echo "$W" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/../cargo-target" >> "$GITHUB_ENV"
      - run: cargo test --release --manifest-path engine/Cargo.toml
      - run: cargo build --release --manifest-path engine/Cargo.toml
      - name: The engine where the next steps find it
        run: |
          mkdir -p engine-dist
          cp "${CARGO_TARGET_DIR:-engine/target}/release/engine-cli.exe" engine-dist/engine-cli.exe
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: engine-cli-windows
          path: engine-dist/engine-cli.exe
          retention-days: 30
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          # D-023: a folder of the job (two runners on the PC shared ~/setup-pnpm: EBUSY).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # D-023: on the PC the pnpm store is already local; saving it to GitHub's cache hung the runners.
          cache: ${{ !vars.CI_RUNNER && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile --filter @tcg/worker
      - run: pnpm -F @tcg/worker package --engine "$GITHUB_WORKSPACE/engine-dist/engine-cli.exe"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tcg-worker-windows
          path: apps/worker/build/tcg-worker-*-windows.zip
          retention-days: 30
      # D-026: an update package with this engine, loaded by the executable the way every PC loads one before
      # switching to it. Here the engine is its own reference: this proves the loader; `windows-update` (below)
      # plays the reference games with the engine the app really serves.
      - run: node apps/worker/scripts/package-windows-update.mjs --engine "$GITHUB_WORKSPACE/engine-dist/engine-cli.exe"
      - name: tcg-worker.exe loads an update package
        run: |
          release="$RUNNER_TEMP/release"
          rm -rf "$release" && mkdir -p "$release"
          C:/Windows/System32/tar.exe -xzf "$(cygpath -w apps/worker/build/windows-x64.tar.gz)" -C "$(cygpath -w "$release")"
          TCG_WORKER_RELEASE="$(cygpath -w "$release/tcg-worker")" TCG_WORKER_DIR="$(cygpath -w "$RUNNER_TEMP/worker-data")" \
            apps/worker/build/package/tcg-worker/tcg-worker.exe --check-engine

  # T-015: the same Docker target used by Fly, plus ARM execution against its native reference (qemu-user).
  android:
    needs: changes
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node apps/worker/scripts/build-android.mjs
      - name: Worker shutdown and Termux installer with doubles on Linux
        run: docker run --rm --entrypoint sh tcg-worker-android-build -c 'apk add --no-cache bash util-linux coreutils && cd /app && pnpm -F @tcg/worker test shutdown installer android-stop'
      - name: ARM determinism under qemu (one and two threads)
        run: docker run --rm --entrypoint sh tcg-worker-android-build -c 'apk add --no-cache qemu-aarch64 && node /app/apps/worker/scripts/check-arm.mjs /android-package/android-package/tcg-worker'
      # D-026: the PCs' update package from the same stages Fly builds (the Windows engine cross-compiled with zig).
      - name: Windows update package
        run: |
          docker build --target windows-package -t tcg-worker-windows-update .
          container="$(docker create tcg-worker-windows-update)"
          mkdir -p apps/worker/build/windows-update-image
          docker cp "$container:/windows-package/." apps/worker/build/windows-update-image/
          docker rm "$container"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tcg-worker-windows-update
          path: apps/worker/build/windows-update-image/tcg-worker-*-windows-x64-update.tar.gz*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tcg-worker-android
          path: apps/worker/build/tcg-worker-*-android-arm64.tar.gz*
          retention-days: 30

  # D-026: the engine-cli.exe the app serves (cross-compiled with zig in the Dockerfile) plays the Linux reference's
  # games on Windows, loaded by the same tcg-worker.exe every PC runs, exactly as a PC checks it before switching.
  windows-update:
    needs: [changes, engine, android]
    if: needs.changes.outputs.engine == 'true'
    runs-on: ${{ vars.CI_RUNNER_WINDOWS || 'windows-latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tcg-worker-windows
          path: zip
      - uses: actions/download-artifact@v4
        with:
          name: tcg-worker-windows-update
          path: update
      - name: The served engine plays the reference games
        run: |
          zip="$(ls zip/tcg-worker-*-windows.zip | head -1)"
          C:/Windows/System32/tar.exe -xf "$(cygpath -w "$zip")" -C "$(cygpath -w zip)"
          package="$(ls update/tcg-worker-*-windows-x64-update.tar.gz | head -1)"
          release="$RUNNER_TEMP/served"
          rm -rf "$release" && mkdir -p "$release"
          C:/Windows/System32/tar.exe -xzf "$(cygpath -w "$package")" -C "$(cygpath -w "$release")"
          TCG_WORKER_RELEASE="$(cygpath -w "$release/tcg-worker")" TCG_WORKER_DIR="$(cygpath -w "$RUNNER_TEMP/worker-data")" \
            zip/tcg-worker/tcg-worker.exe --check-engine

  # The production image (Dockerfile), built and thrown away: only on main and only when its inputs changed.
  docker:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.docker == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag tcg-pocket:ci .
