name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @tcg/domain build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Supertest suite against a real Postgres 17 (migrations applied by test/global-setup.ts).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tcg
          POSTGRES_PASSWORD: tcg
          POSTGRES_DB: tcg
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tcg -d tcg"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tcg:tcg@127.0.0.1:5433/tcg_test
      SESSION_SECRET: ci-session-secret-ci-session-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @tcg/domain build
      - run: pnpm -F @tcg/api test:e2e

  # engine-cli (AGPL, deckgym-core pinned in engine/Cargo.toml): unit tests and a Windows build kept as an artifact,
  # for a PC without Rust (the worker takes any engine-cli.exe via TCG_ENGINE_PATH or config.json). Also the portable
  # worker (tcg-worker.exe + engine-cli.exe + LEEME.txt) for another PC without Node, Rust or the repository.
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test --release --manifest-path engine/Cargo.toml
      - run: cargo build --release --manifest-path engine/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: engine-cli-windows
          path: engine/target/release/engine-cli.exe
          retention-days: 30
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @tcg/worker
      - run: pnpm -F @tcg/worker package
      - uses: actions/upload-artifact@v4
        with:
          name: tcg-worker-windows
          path: apps/worker/build/tcg-worker-*-windows.zip
          retention-days: 30
