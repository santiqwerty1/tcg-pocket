# Local development database. Production uses Supabase (docs/PLAN.md §2).
services:
  postgres:
    image: postgres:17-alpine
    container_name: tcg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
      POSTGRES_DB: tcg
    ports:
      - "5433:5432"
    volumes:
      - tcg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tcg-postgres-data:
