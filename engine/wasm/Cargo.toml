[package]
name = "engine-wasm"
version = "0.1.0"
edition = "2021"
# Links deckgym-core (AGPL-3.0) and shares engine-cli's bots and coach: a derivative work under the same license
# (DECISIONES A.5). The PWA serves it to the owner's browser with its source on offer (docs/LICENCIAS.md, T-015).
license = "AGPL-3.0-only"
publish = false
description = "deckgym-core for the browser: one game of the owner against a bot, one decision at a time (T-015)."

# Its own lock, started from engine/Cargo.lock (same deckgym and the same versions of what both use). The rev must be
# engine-cli's: build.rs refuses to build otherwise.
[dependencies]
deckgym = { git = "https://github.com/santiqwerty1/deckgym-core", rev = "77e06172742bb776b232d6e5c2ca576181be97aa" }
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
wasm-bindgen = "=0.2.129"

# rand 0.8 builds getrandom 0.2, which needs its JS backend on wasm32-unknown-unknown (P-008).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lib]
crate-type = ["cdylib", "rlib"]
# engine-cli's bot and coach files come with their own unit tests, which need engine-cli's main.rs: only the tests in
# tests/ run here.
test = false
doctest = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
