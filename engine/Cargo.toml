[package]
name = "engine-cli"
version = "0.3.15"
edition = "2021"
# Links deckgym-core (AGPL-3.0): this executable is a derivative work under the same license (DECISIONES A.5).
license = "AGPL-3.0-only"
publish = false
description = "JSON front end of deckgym-core for the TCG Pocket worker: validate, simulate and optimize decks."

[dependencies]
# The engine, pinned: our fork of bcollazo/deckgym-core (D-031), on upstream adfe505 since 18/10/2026, with only what
# upstream does not have yet, each in a branch of its own: the target of Quick-Grow Extract and Wallace (#399, upstream
# PR #420), the bots' exports (feat/bot-api) and a value function that skips its terms of weight 0
# (santiqwerty1/deckgym-core#1, the same games). Branch `next/adfe505` of the fork, tag `pin-c87bad0`. Bump the rev
# here (and in engine/wasm) to update it: docs/OPERACION.md, «El motor: nuestra copia de deckgym».
deckgym = { git = "https://github.com/santiqwerty1/deckgym-core", rev = "c87bad0799de162d0b0c870748319d512f5482d2" }
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.27"
uuid = { version = "1", features = ["v4"] }

# How the process ends, said on stderr (src/exit.rs, H-054): signal handlers and atexit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Opt out of Windows power throttling (EcoQoS): a hidden worker would otherwise run on the efficiency cores only.
[target.'cfg(windows)'.dependencies]
# and the CPU regulator (src/regulate.rs): the machine's cores, its busy time and the engines' affinity.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
