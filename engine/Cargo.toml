[package]
name = "engine-cli"
version = "0.3.18"
edition = "2021"
# Links deckgym-core (AGPL-3.0): this executable is a derivative work under the same license (DECISIONES A.5).
license = "AGPL-3.0-only"
publish = false
description = "JSON front end of deckgym-core for the TCG Pocket worker: validate, simulate and optimize decks."

[dependencies]
# The engine, pinned: our fork of bcollazo/deckgym-core (D-031), on upstream 97b8787 since 12/11/2026 (C1 «Dual
# Fusion» and P-C, with printed dual types, and upstream's rule fixes to 2/11), with only what upstream does not have
# yet, each in a branch of its own: the bots' exports (feat/bot-api) and a value function that skips its terms of
# weight 0 (santiqwerty1/deckgym-core#1, the same games). Branch `next/97b8787` of the fork, tag `pin-ca13408`. Bump
# the rev here (and in engine/wasm) to update it: docs/OPERACION.md, «El motor: nuestra copia de deckgym».
deckgym = { git = "https://github.com/santiqwerty1/deckgym-core", rev = "ca134083ff86df471102d56bf90784e93cd8d408" }
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.27"
uuid = { version = "1", features = ["v4"] }

# How the process ends, said on stderr (src/exit.rs, H-054): signal handlers and atexit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Opt out of Windows power throttling (EcoQoS): a hidden worker would otherwise run on the efficiency cores only.
[target.'cfg(windows)'.dependencies]
# and the CPU regulator (src/regulate.rs): the machine's cores, its busy time and the engines' affinity.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
