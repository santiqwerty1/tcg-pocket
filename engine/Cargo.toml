[package]
name = "engine-cli"
version = "0.3.5"
edition = "2021"
# Links deckgym-core (AGPL-3.0): this executable is a derivative work under the same license (DECISIONES A.5).
license = "AGPL-3.0-only"
publish = false
description = "JSON front end of deckgym-core for the TCG Pocket worker: validate, simulate and optimize decks."

[dependencies]
# The engine, pinned and unmodified. Bump the rev here (and nothing else) to update it.
deckgym = { git = "https://github.com/bcollazo/deckgym-core", rev = "33ff2a5942dd4ce09d1ebc3041ffe48f604409e6" }
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.27"
uuid = { version = "1", features = ["v4"] }

# Opt out of Windows power throttling (EcoQoS): a hidden worker would otherwise run on the efficiency cores only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
