[package]
name = "engine-cli"
version = "0.3.13"
edition = "2021"
# Links deckgym-core (AGPL-3.0): this executable is a derivative work under the same license (DECISIONES A.5).
license = "AGPL-3.0-only"
publish = false
description = "JSON front end of deckgym-core for the TCG Pocket worker: validate, simulate and optimize decks."

[dependencies]
# The engine, pinned: our fork of bcollazo/deckgym-core (D-031, 15/10/2026), upstream 4e25889 plus rule fixes, each in
# a branch of its own for upstream (Heavy Helmet only against attacks #383, the target of Quick-Grow Extract and
# Wallace #399, no Active #398, DiscardFossil once #397, "et" #396) and the bots' exports (feat/bot-api). Branch
# `tcg-pocket` of the fork. Bump the rev here (and in engine/wasm) to update it.
deckgym = { git = "https://github.com/santiqwerty1/deckgym-core", rev = "0b510d1b1b96ac356ea375e0f06a88e324a1bd9c" }
rand = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.27"
uuid = { version = "1", features = ["v4"] }

# How the process ends, said on stderr (src/exit.rs, H-054): signal handlers and atexit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Opt out of Windows power throttling (EcoQoS): a hidden worker would otherwise run on the efficiency cores only.
[target.'cfg(windows)'.dependencies]
# and the CPU regulator (src/regulate.rs): the machine's cores, its busy time and the engines' affinity.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
