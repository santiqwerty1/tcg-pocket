# Fly.io app definition (docs/PLAN.md §2, DECISIONES A.1): one shared-cpu-1x 512 MB machine, always on.
# Secrets (`fly secrets set …`): DATABASE_URL (Supabase pooler, session mode), SESSION_SECRET.
app = "tcg-pocket"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  WEB_DIST = "/app/apps/web/dist"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # /healthz pings the database (503 when it does not answer). The grace period covers `prisma migrate deploy` and the
  # 4.3k-card catalog load on a cold start.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
